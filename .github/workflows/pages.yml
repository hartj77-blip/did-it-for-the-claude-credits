# Builds the peer-to-peer version of Card Club and publishes it to GitHub Pages.
# Runs tests on every push; only pushes to the default branch (or a manual run) deploy.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Card Club on GitHub Pages

on:
  push:
    paths:
      - 'card-club/**'
      - 'golf.html'
      - 'zombies.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card-club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: card-club/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - name: Include the golf and zombies games too
        run: cp ../golf.html ../zombies.html dist-web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: card-club/dist-web

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
